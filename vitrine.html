<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demonstração de Vitrine</title>
  <meta name="description" content="Vitrine online da LK Parafusos e Ferragens — confira o catálogo completo de parafusos, ferragens e ferramentas direto no navegador.">
  <meta name="robots" content="noindex, follow">
  <meta name="language" content="pt-BR">

  <link rel="canonical" href="https://www.lkparafusoseferragens.com.br/vitrine.html">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --white:          #FFFFFF;
      --navy:           #10294A;
      --orange:         #E17A1D;
      --orange-dark:    #B35F12;
      --orange-pale:    #FCEAD3;
      --text-dark:      #1A2230;
      --green-wpp:      #128C4A;
      --green-wpp-dark: #0D6B39;
      --header-h:       80px;
      --ease:           0.3s ease;
      --ease-bounce:    0.35s cubic-bezier(.34, 1.56, .64, 1);
      --r-pill:         999px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
    }

    a { color: inherit; }
    img { max-width: 100%; display: block; }

    /* ==========================================
       HEADER — fixo, 80px, sempre (não encolhe
       em telas pequenas, conforme especificação)
    ========================================== */
    #site-header {
      flex: 0 0 var(--header-h);
      width: 100%;
      height: var(--header-h);
      background: rgba(255, 255, 255, 0.97);
      border-bottom: 1px solid rgba(16, 41, 74, 0.08);
      position: relative;
      z-index: 10;
    }

    .header-inner {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 2rem;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      text-decoration: none;
      min-width: 0;
      flex-shrink: 1;
    }

    .logo img {
      height: 72px;
      width: auto;
      flex-shrink: 0;
    }

    .logo-text {
      display: flex;
      flex-direction: column;
      line-height: 1;
      min-width: 0;
      overflow: hidden;
    }

    .logo-name {
      font-family: 'Oswald', sans-serif;
      font-size: 1.12rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--navy);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .logo-tag {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--orange-dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 0.28rem;
    }

    .main-nav { display: flex; align-items: center; gap: 0.25rem; }

    .main-nav a {
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-dark);
      padding: 0.55rem 0.85rem;
      border-radius: var(--r-pill);
      transition: color var(--ease), background var(--ease);
    }

    .main-nav a:hover, .main-nav a:focus-visible {
      color: var(--orange-dark);
      background: var(--orange-pale);
      outline: none;
    }

    .nav-vitrine {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 0.95rem;
      border: 1.5px solid var(--orange);
      border-radius: var(--r-pill);
      color: var(--navy) !important;
      font-size: 0.85rem !important;
      font-weight: 700 !important;
      background: var(--orange-pale);
    }

    .nav-vitrine svg { width: 14px; height: 14px; }

    .btn-nav-whatsapp {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--green-wpp);
      color: var(--white) !important;
      padding: 0.58rem 1.15rem;
      border-radius: var(--r-pill);
      font-size: 0.83rem !important;
      font-weight: 700 !important;
      text-decoration: none;
      margin-left: 0.5rem;
      transition: background var(--ease), transform var(--ease-bounce);
    }

    .btn-nav-whatsapp:hover, .btn-nav-whatsapp:focus-visible {
      background: var(--green-wpp-dark) !important;
      transform: translateY(-1px);
      outline: none;
    }

    .nav-toggle {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.4rem;
      color: var(--text-dark);
      line-height: 0;
    }

    .nav-toggle:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; border-radius: 3px; }

    @media (max-width: 1250px) {
      .logo img { height: 66px; }

      .main-nav {
        display: none;
        position: fixed;
        top: var(--header-h);
        left: 0; right: 0;
        background: var(--white);
        flex-direction: column;
        align-items: flex-start;
        padding: 1.5rem 2rem 2rem;
        gap: 1.25rem;
        border-bottom: 1px solid rgba(16, 41, 74, 0.1);
        box-shadow: 0 8px 28px rgba(16, 41, 74, 0.1);
        z-index: 20;
        max-height: calc(100vh - var(--header-h));
        overflow-y: auto;
      }

      .main-nav.open { display: flex; }
      .btn-nav-whatsapp { display: none; }
      .nav-toggle { display: block; }
    }

    @media (max-width: 420px) {
      .header-inner { padding: 0 1rem; gap: 0.75rem; }
      .logo { gap: 0.5rem; }
      .logo img { height: 58px; }
      .logo-tag { font-size: 0.55rem; letter-spacing: 0.1em; }
    }

    /* ==========================================
       IFRAME DA VITRINE — ocupa 100% do espaço
       restante (100vh - altura do header)
    ========================================== */
    .vitrine-frame {
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      border: none;
      display: block;
    }
  </style>
</head>

<body>

  <header id="site-header" role="banner">
    <div class="header-inner">

        <img src="images/logo.svg" alt="Logotipo LK Parafusos e Ferragens" width="200" height="72">
      </a>

      <nav id="main-nav" class="main-nav" role="navigation" aria-label="Menu principal">
        <a href="index.html#inicio">Início</a>
        <a href="index.html#sobre">Sobre</a>
        <a href="index.html#produtos">Produtos</a>
        <a href="index.html#atendemos">Atendemos</a>
        <a href="index.html#contato">Contato</a>
        <a href="vitrine.html" class="nav-vitrine" aria-label="Vitrine online (você está aqui)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 9l1-5h16l1 5"/>
            <path d="M3 9h18v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9z"/>
            <path d="M9 21V13h6v8"/>
          </svg>
          Vitrine
        </a>
        <a href="https://wa.me/556791405777"
           target="_blank"
           rel="noopener noreferrer"
           class="btn-nav-whatsapp"
           aria-label="Fale conosco pelo WhatsApp">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
          </svg>
          WhatsApp
        </a>
      </nav>

      <button class="nav-toggle"
              id="nav-toggle"
              aria-label="Abrir menu"
              aria-expanded="false"
              aria-controls="main-nav">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
          <line x1="3" y1="6"  x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>
  </header>

  <iframe id="vitrine-iframe"
          class="vitrine-frame"
          src="https://lkparafusos.egestor.com.br/vitrine/"
          title="Vitrine online da LK Parafusos e Ferragens"
          style="width:100%; border:none;"></iframe>

  <script>
    const toggle = document.getElementById('nav-toggle');
    const nav = document.getElementById('main-nav');

    toggle.addEventListener('click', () => {
      const open = nav.classList.toggle('open');
      toggle.setAttribute('aria-expanded', open);
      toggle.setAttribute('aria-label', open ? 'Fechar menu' : 'Abrir menu');
    });

    nav.querySelectorAll('a').forEach(a => {
      a.addEventListener('click', () => {
        nav.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.setAttribute('aria-label', 'Abrir menu');
      });
    });

    // Altura do iframe = altura da janela - altura do header (sem badge/rodapé nesta página)
    const header = document.getElementById('site-header');
    const iframe = document.getElementById('vitrine-iframe');

    function resizeVitrineFrame() {
      const headerH = header.offsetHeight;
      iframe.style.height = (window.innerHeight - headerH) + 'px';
    }

    window.addEventListener('resize', resizeVitrineFrame);
    window.addEventListener('orientationchange', resizeVitrineFrame);
    resizeVitrineFrame();
  </script>
